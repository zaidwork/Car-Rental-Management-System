<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Optimization -->
    <title>TAJ SYSTEM | نظام التاج لإدارة وتأجير السيارات</title>
    <meta name="description" content="نظام التاج لإدارة وتأجير أسطول السيارات والعقود والعملاء" />
    <meta name="theme-color" content="#2d180c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تأجير التاج" />
    <meta name="application-name" content="تأجير التاج" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="images/logo_192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <!-- Google Arabic Fonts (Cairo & Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      // تسجيل الـ Service Worker لتمكين تثبيت التطبيق والعمل أوفلاين
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then((registration) => {
            console.log('TAJ PWA ServiceWorker registered with scope:', registration.scope);
          }).catch((error) => {
            console.warn('TAJ PWA ServiceWorker registration failed:', error);
          });
        });
      }
    </script>
  </body>
</html>
